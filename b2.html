<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout 4 tầng giống VnExpress</title>
  <link rel="stylesheet" href="cssb2.css">
</head>

<body>
  <div class="container">

    <!-- TẦNG 1 -->
    <div class="header">VNEXPRESS DEMO</div>

    <!-- TẦNG 2 -->
    <div class="menu">
      <div>Thời sự</div>
      <div>Thế giới</div>
      <div>Kinh doanh</div>
      <div>Công nghệ</div>
      <div>Giải trí</div>
      <div>Thể thao</div>
    </div>

    <!-- TẦNG 3 -->
    <div class="content">
      <div class="left">
        <div class="main-news">Tin nổi bật</div>

        <div class="news-list">
          <div class="card">Tin 1</div>
          <div class="card">Tin 2</div>
          <div class="card">Tin 3</div>
          <div class="card">Tin 4</div>
        </div>
      </div>

      <div class="right">
        <h3>Tin xem nhiều</h3>
        <p>- Bài viết 1</p>
        <p>- Bài viết 2</p>
        <p>- Bài viết 3</p>
        <p>- Bài viết 4</p>
      </div>
    </div>

    <!-- TẦNG 4 -->
    <div class="footer">Footer - Bản quyền VnExpress Demo</div>

  </div>
</body>
</html>
